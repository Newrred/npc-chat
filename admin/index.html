<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사이 · 대화 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#29332f;font:15px system-ui,sans-serif}header{padding:24px 28px;background:white;border-bottom:1px solid #ddd}h1{font-size:23px;margin:0}p{line-height:1.6;color:#68736b}button{font:inherit;cursor:pointer;border:1px solid #cbd5cc;border-radius:12px;padding:12px;background:white;color:inherit}button:hover{background:#e7eee7}button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:320px 1fr;max-width:1200px;margin:auto;min-height:70vh}aside{padding:20px;border-right:1px solid #ddd}#rooms{display:grid;gap:8px}#rooms button{text-align:left}main{padding:24px}article{padding:12px 16px;border-radius:16px;background:white;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.user{margin-left:12%;background:#deeadf}.assistant{margin-right:12%}small{color:#66776b}#status{margin:12px 28px}#more{margin-top:12px}[hidden]{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}#rooms{max-height:200px;overflow:auto}main{padding:16px}}
</style>
<header><h1>사이 <small>대화 관리</small></h1><p>이 PC에서만 볼 수 있는 조회 화면입니다. 방문자는 브라우저 기준의 익명 구분이며, 사람 수와 같지 않습니다.<br>사용자가 대화방을 나가면 해당 대화·기억·관계가 초기화되어 여기서도 사라집니다.</p><a href="/inspector" target="_blank" rel="noopener">모델 검사 창 열기 ↗</a> <button id="refresh">새로고침</button></header>
<p id="status" role="status"></p><div class="layout"><aside><h2>방문자 대화</h2><div id="rooms"></div><button id="more" hidden>다음 대화 목록</button></aside><main><h2 id="title">대화를 선택해 주세요</h2><button id="older" hidden>이전 대화 더 보기</button><div id="messages"></div></main></div>
<script>
const $=id=>document.getElementById(id);let selected=null,cursor=null,next=null,generation=0;
async function get(url){const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(15000)});const data=await r.json();if(!r.ok)throw Error(data.error||'조회 실패');return data;}
function showError(e){$('status').textContent=e.message;}
function render(items,prepend=false){const fragment=document.createDocumentFragment();for(const turn of items){for(const role of ['user','assistant']){const row=document.createElement('article');row.className=role;const label=document.createElement('small');label.textContent=(role==='user'?'방문자':'캐릭터')+' · '+new Date(turn.created*1000).toLocaleString('ko-KR');const text=document.createElement('div');text.textContent=role==='user'?turn.user_message:turn.reply;row.append(label,text);fragment.append(row);}}if(prepend)$('messages').prepend(fragment);else $('messages').replaceChildren(fragment);}
async function loadConversation(older=false){if(!selected)return;const token=++generation;$('older').disabled=true;try{const p=new URLSearchParams(selected);if(older&&cursor)p.set('before',cursor);const data=await get('/api/turns?'+p);if(token!==generation)return;render(data.items,older);cursor=data.before;$('older').hidden=!cursor;$('status').textContent=data.items.length?'':'저장된 대화가 없습니다.';}catch(e){if(token===generation)showError(e);}finally{if(token===generation)$('older').disabled=false;}}
async function loadRooms(offset=0){try{const data=await get('/api/rooms?offset='+offset);if(!offset)$('rooms').replaceChildren();for(const room of data.items){const b=document.createElement('button');b.textContent='방문자 '+room.profile_id.slice(0,10)+' · '+room.character_id+'\n'+room.turns+'회 대화 · '+new Date(room.updated*1000).toLocaleString('ko-KR');b.onclick=()=>{selected={profile_id:room.profile_id,character_id:room.character_id};$('title').textContent='방문자 '+room.profile_id.slice(0,10)+' · '+room.character_id;$('messages').replaceChildren();void loadConversation();};$('rooms').append(b);}next=data.next;$('more').hidden=next===null;$('status').textContent=data.items.length?'':'아직 저장된 대화가 없습니다.';}catch(e){showError(e);}}
$('refresh').onclick=async()=>{await loadRooms();await loadConversation();};$('more').onclick=()=>loadRooms(next);$('older').onclick=()=>loadConversation(true);void loadRooms();
</script></html>
